# ======================================================
#  Food Ordering Application - Application Properties
# ======================================================

server.port=8080
spring.profiles.default=cloud

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET:WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb25NdXN0QmVBdExlYXN0MjU2Qml0c0xvbmdGb3JIUjI1NkFsZ29yaXRobQ==}
jwt.expiration=86400000

# ==================== CORS Configuration ====================
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174

# ==================== JSON Serialization Configuration ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==================== Swagger / OpenAPI Configuration ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

# ==================== Email Configuration (Gmail SMTP) ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kamaliga2109@gmail.com}
spring.mail.password=${MAIL_PASSWORD:k@m@/!9@}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==================== Logging Configuration ====================
logging.level.root=INFO
logging.level.com.foodapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=food-ordering-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ==================== Bootstrap Admin ====================
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Admin}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@foodapp.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
